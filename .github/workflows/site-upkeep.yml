name: Site upkeep

# After each publish, give archived editions their own canonical address and refresh sitemap.xml,
# then fail loudly if any page picked up code it should not carry.
on:
  push:
    branches: [main]
    paths: ["*.html", "editions/**", "meetings/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/site_upkeep.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A editions sitemap.xml drinks.html
            git commit -m "Site upkeep: archive canonicals and sitemap"
            # The publisher can push in the same second; retry instead of failing.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Content guard
        run: python3 scripts/content_guard.py
