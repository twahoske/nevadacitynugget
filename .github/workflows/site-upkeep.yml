name: Site upkeep

# After each publish, give archived editions their own canonical address and refresh sitemap.xml.
on:
  push:
    branches: [main]
    paths: ["index.html", "editions/**", "drinks.html", "standards.html", "scripts/site_upkeep.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/site_upkeep.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A editions sitemap.xml drinks.html
            git commit -m "Site upkeep: archive canonicals and sitemap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
