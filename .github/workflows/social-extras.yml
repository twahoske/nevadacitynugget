name: Social extras

# The day's second and third posts (Todd, Nov 14 2026), drawn from that morning's paper:
#   merchant   8:30 AM Pacific: Merchant of the Day (feed, Story, Facebook); posted by
#              the morning run in social-post.yml, these runs catch it up until 7:30 PM
#   spotlight  about 4:30 PM Pacific: the first Tonight / Grand Opening / Now Open item,
#              only on days the paper has one (feed, Story, Facebook)
#   restorative about 3 PM Pacific, Wednesdays and Saturdays only: The Daily Restorative
#              (Tonics & Tinctures wellness spotlight; window 2:45-3:45 PM)
#   weekly     Thursday ~3 PM Thirsty Thursday (a bar from the Bar Guide), Friday ~1 PM
#              the Geezer Gig at the Crazy Horse, Saturday ~9 AM live music this weekend
#              (only when social/weekly/YYYY-MM-DD.json exists)
#   radio      about 7:30 PM Pacific, third Wednesday of the month only: Under the
#              Influence on KVMR, from the paper's third-Wednesday box (window 7:25-8:30)
# Times are UTC and GitHub cron can run late or skip, so each slot has backup runs;
# scripts/social_post.py posts each slot once a day, inside its Pacific window
# (merchant 8:30 AM-7:30 PM, spotlight 4:00-7:30 PM), and skips Promotional,
# Courtesy, Sponsored or Paid items. A manual run defaults to a dry run.
on:
  # GitHub's timer can run hours late (Nov 15 2026 the 11:30 run never came), so
  # every push to main (the Site Publisher's hourly copy of the paper, Site upkeep)
  # is also a chance to post whichever slot is open; it posts nothing outside one.
  push:
    branches: [main]
  schedule:
    - cron: "30 19 * * *"
    - cron: "15 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 0 * * *"
    - cron: "15 1 * * *"
    - cron: "0 2 * * *"
    # radio (Todd, Nov 18 2026): Under the Influence, ~7:30 PM Pacific (PST, then PDT);
    # the script posts it only on the third Wednesday of the month
    - cron: "32 3 * * *"
    - cron: "32 2 * * *"
    # restorative (Wed + Sat ~3 PM Pacific; the script ignores other days)
    - cron: "50 22 * * *"
    - cron: "5 23 * * *"
    - cron: "35 23 * * *"
    # weekly (UTC day of week): Thursday ~3 PM, Friday ~1 PM, Saturday ~9 AM Pacific
    - cron: "0 23 * * 4"
    - cron: "45 23 * * 4"
    - cron: "0 21 * * 5"
    - cron: "45 21 * * 5"
    - cron: "0 17 * * 6"
    - cron: "45 17 * * 6"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which post"
        type: choice
        options: [merchant, spotlight, restorative, weekly, radio]
        default: merchant
      pick:
        description: "Spotlight only: words from the one to post (blank = the first)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (draw the cards, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'yes' || 'no' }}
      # Weekly crons are the ones with a day of the week; the daily ones end "* * *".
      SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || github.event_name == 'push' && 'auto' || (endsWith(github.event.schedule, '* * *') && 'auto' || 'weekly') }}
      SPOT_MATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.pick || '' }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        run: python3 scripts/social_post.py gate
        env:
          IGNORE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'yes' || 'no' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - if: steps.gate.outputs.go == 'yes'
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - if: steps.gate.outputs.go == 'yes'
        run: python3 scripts/social_post.py render
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-cards-${{ github.run_id }}
          path: out/
          retention-days: 14
      - if: steps.gate.outputs.go == 'yes'
        run: python3 scripts/social_post.py publish
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      # Second pass (Nov 17 2026): when two slots are open and unposted (a missed
      # merchant post and the spotlight at the 4:58 PM Evening Edition push),
      # post the other one in the same run. Automatic runs only.
      - id: gate2
        if: steps.gate.outputs.go == 'yes' && github.event_name != 'workflow_dispatch'
        run: python3 scripts/social_post.py gate
        env:
          IGNORE_WINDOW: "no"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - if: steps.gate2.outputs.go == 'yes'
        run: python3 scripts/social_post.py render
        env:
          SLOT: ${{ steps.gate2.outputs.slot }}
      - if: steps.gate2.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-cards-${{ github.run_id }}-2
          path: out/
          retention-days: 14
      - if: steps.gate2.outputs.go == 'yes'
        run: python3 scripts/social_post.py publish
        env:
          SLOT: ${{ steps.gate2.outputs.slot }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
