name: What's New post

# Release-notes features on Instagram (feed + Story) and Facebook, one feature per
# post, twice a day (Todd, Nov 16 2026): aimed at ~10 AM and ~8 PM Pacific, with windows
# of 10:00 AM-12:00 PM and 8:00-11:30 PM so a late timer still lands (Nov 19 2026), clear
# of the front (~6 AM), Merchant (~8:30 AM), Saturday roundup (~9 AM), Geezer Gig
# (Fri ~1 PM), Thirsty Thursday (~3 PM) and spotlight (4-7:30 PM) posts.
# Queue: social/whats-new/queue.json (oldest release first); a release in
# release-notes.html with no queue entries is posted from its bullets.
# GitHub's timer runs late and drops runs (on Nov 17-18 the old "5,35" entries fired
# hours off and three slots were missed), so each window gets its own one-line crons
# every 15 minutes at odd minutes, and every push to main is also a chance.
# scripts/whats_new_post.py posts at most one item per slot a day, so extra runs are safe.
# A manual run is a dry run unless unticked; give it an item id to draw that one.
on:
  push:
    branches: [main]
  schedule:
    # am: 10 AM-12 PM Pacific (PST 18-19 UTC, PDT 17-18 UTC), every 15 minutes
    - cron: "7 17 * * *"
    - cron: "22 17 * * *"
    - cron: "37 17 * * *"
    - cron: "52 17 * * *"
    - cron: "7 18 * * *"
    - cron: "22 18 * * *"
    - cron: "37 18 * * *"
    - cron: "52 18 * * *"
    - cron: "7 19 * * *"
    - cron: "22 19 * * *"
    - cron: "37 19 * * *"
    - cron: "52 19 * * *"
    # pm: 8-11:30 PM Pacific (PST 4-7 UTC, PDT 3-6 UTC), every 15 minutes
    - cron: "7 3 * * *"
    - cron: "22 3 * * *"
    - cron: "37 3 * * *"
    - cron: "52 3 * * *"
    - cron: "7 4 * * *"
    - cron: "22 4 * * *"
    - cron: "37 4 * * *"
    - cron: "52 4 * * *"
    - cron: "7 5 * * *"
    - cron: "22 5 * * *"
    - cron: "37 5 * * *"
    - cron: "52 5 * * *"
    - cron: "7 6 * * *"
    - cron: "22 6 * * *"
    - cron: "37 6 * * *"
    - cron: "52 6 * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Draw this item id (e.g. 0.9.7-streak) for a look; never posted"
        type: string
        default: ""
      dry_run:
        description: "Dry run (draw the cards, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: whats-new-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        run: python3 scripts/whats_new_post.py gate
        env:
          ITEM: ${{ github.event_name == 'workflow_dispatch' && inputs.item || '' }}
          IGNORE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'yes' || 'no' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - if: steps.gate.outputs.go == 'yes'
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - if: steps.gate.outputs.go == 'yes'
        run: python3 scripts/whats_new_post.py render
        env:
          ITEM_ID: ${{ steps.gate.outputs.item }}
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: whats-new-cards-${{ github.run_id }}
          path: out/
          retention-days: 14
      - if: steps.gate.outputs.go == 'yes'
        run: python3 scripts/whats_new_post.py publish
        env:
          ITEM_ID: ${{ steps.gate.outputs.item }}
          SLOT: ${{ steps.gate.outputs.slot }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
